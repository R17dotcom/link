<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Gift 🎁</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffe4ec, #fff5f8);
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: #3a2630;
}

.page {
  width: min(92vw, 520px);
  text-align: center;
  padding: 30px 20px;
}

h1 {
  margin: 0 0 25px;
  font-size: 28px;
}

.gift-wrap {
  position: relative;
  width: 190px;
  height: 190px;
  margin: 0 auto 20px;
  cursor: pointer;
  transition: transform .35s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.box {
  position: absolute;
  left: 15px;
  bottom: 10px;
  width: 160px;
  height: 120px;
  background: #f28c28;
  border-radius: 8px;
  box-shadow: 0 12px 30px rgba(100,30,50,.2);
}

.box::after {
  content: "";
  position: absolute;
  left: 68px;
  top: 0;
  width: 24px;
  height: 120px;
  background: #1769d1;
}

.lid {
  position: absolute;
  left: 5px;
  top: 38px;
  width: 180px;
  height: 38px;
  background: #ff9f1c;
  border-radius: 8px;
  z-index: 3;
  transform-origin: 50% 100%;
  transition: transform .45s ease, top .45s ease;
}

.lid::after {
  content: "";
  position: absolute;
  left: 78px;
  top: 0;
  width: 24px;
  height: 38px;
  background: #1769d1;
}

.bow {
  position: absolute;
  top: 8px;
  left: 68px;
  width: 55px;
  height: 30px;
  z-index: 4;
}

.bow::before,
.bow::after {
  content: "";
  position: absolute;
  width: 30px;
  height: 22px;
  background: #1769d1;
  border-radius: 50% 50% 50% 5px;
}

.bow::before {
  transform: rotate(25deg);
  left: 0;
}

.bow::after {
  transform: rotate(-25deg);
  right: 0;
}

.message {
  font-weight: bold;
  font-size: 17px;
  min-height: 24px;
}

.gift-wrap.tap1 {
  transform: scale(1.18);
}

.gift-wrap.tap1 .lid {
  transform: translateY(-7px) rotate(-3deg);
}

.gift-wrap.tap2 {
  transform: scale(1.42);
  animation: shake .35s ease;
}

.gift-wrap.tap2 .lid {
  transform: translateY(-12px) rotate(-7deg);
}

.gift-wrap.tap3 {
  transform: scale(1.8);
  animation: shake .45s ease;
}

.gift-wrap.burst {
  animation: burst .65s ease forwards;
}

.gift-wrap.burst .box,
.gift-wrap.burst .lid,
.gift-wrap.burst .bow {
  animation: disappear .35s ease forwards;
}

.page.revealed .gift-wrap,
.page.revealed h1,
.page.revealed .message {
  display: none;
}

.meme {
  display: none;
  margin: 20px auto 0;
}

.page.revealed .meme {
  display: block;
  animation: memePop .7s cubic-bezier(.2,.8,.2,1) forwards;
}

.meme img {
  width: 100%;
  max-width: 500px;
  border-radius: 14px;
  box-shadow: 0 14px 35px rgba(0,0,0,.25);
}

.reveal-text {
  margin-top: 15px;
  font-size: 28px;
}

@keyframes shake {
  0% { transform: scale(1.42) rotate(0deg); }
  25% { transform: scale(1.46) rotate(-4deg); }
  50% { transform: scale(1.50) rotate(4deg); }
  75% { transform: scale(1.54) rotate(-3deg); }
  100% { transform: scale(1.58) rotate(0deg); }
}

@keyframes burst {
  0% { transform: scale(1.8); opacity: 1; }
  45% { transform: scale(2.15); opacity: 1; }
  100% { transform: scale(3.5); opacity: 0; }
}

@keyframes disappear {
  to {
    opacity: 0;
    transform: scale(1.3) rotate(15deg);
  }
}

@keyframes memePop {
  0% {
    opacity: 0;
    transform: scale(.35) rotate(-4deg);
  }
  70% {
    opacity: 1;
    transform: scale(1.05) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}
</style>
</head>

    <div class="box"></div>

<script>
const gift = document.getElementById("gift");
const page = document.getElementById("page");
const message = document.getElementById("message");

let taps = 0;

function vibrate(pattern) {
  // Vibration works on supported mobile browsers.
  if (navigator.vibrate) {
    navigator.vibrate(pattern);
  }
}

gift.addEventListener("click", () => {
  taps++;

  // Every tap gives a little physical feedback on supported phones.
  vibrate(taps === 1 ? 60 : taps === 2 ? [50, 40, 70] : [60, 35, 60, 35, 100]);

  if (taps === 1) {
    gift.classList.add("tap1");
    message.textContent = "Okay okay tap again once more baby!";
  }

  else if (taps === 2) {
    gift.classList.remove("tap1");
    gift.classList.add("tap2");
    message.textContent = "Almost there";
  }

  else if (taps === 3) {
    gift.classList.remove("tap2");
    gift.classList.add("tap3");
    message.textContent = "👁️👄👁️";

    setTimeout(() => {
      gift.classList.add("burst");

      setTimeout(() => {
        page.classList.add("revealed");
      }, 450);

    }, 250);
  }
});
</script>
